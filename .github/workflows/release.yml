name: release

# On a tag v<version> that is the version in package.json: checks the code, builds the bundle,
# runs it on Node 22 and 26, and publishes dist/elserelay.mjs with its sha256 as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    # GitHub-hosted: this repository is public, so its runners are free.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: The tag is the version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG is not v$version, the version in package.json" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run bundle
      - run: npm run smoke
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run the bundle on Node 22 too
        run: npm run smoke
      - name: Publish
        run: |
          cd dist
          sha256sum elserelay.mjs > elserelay.mjs.sha256
          gh release create "$TAG" elserelay.mjs elserelay.mjs.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
