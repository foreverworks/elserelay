name: image

# Builds the container image and publishes it to GitHub's registry as
# ghcr.io/<repository>:<full commit>, when ci has passed on a push to main, and by hand.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # A pull request, a fork or another branch never gets past this.
    if: >-
      github.event.repository.private == false && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is started before it is published: one whose program does not
      # run, or that is not healthy within half a minute, publishes nothing.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: elserelay-check
      - name: Start it and wait until it is healthy
        run: |
          mkdir -p data/tokens
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > data/tokens/token-probe
          printf '%s' '{"store":"/data/b.sqlite","tokensDir":"/data/tokens","listen":{"host":"0.0.0.0","allowedHosts":["probe.invalid"],"mcpPort":7410,"adapterPort":7411},"containers":{"probe":{"product":"fake"}}}' > data/config.json
          sudo chown -R 10001:10001 data
          docker run -d --name check --init --read-only --cap-drop ALL -v "$PWD/data:/data" elserelay-check
          for _ in $(seq 15); do
            docker exec check node /app/dist/cli.js health && exit 0
            sleep 2
          done
          docker logs check
          exit 1
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Say what was published
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published \`$IMAGE:$SHA@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
